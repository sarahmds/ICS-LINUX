<VirtualHost *:80>

	ServerName lojainfoweb.com.br
	DocumentRoot /var/www/lojainfoweb.com.br

	<Directory /var/www/lojainfoweb.com.br>
		Options -Indexes +FollowSymLinks
		AllowOverride None
		Require all granted
	</Directory>

	ErrorLog ${APACHE_LOG_DIR}/lojainfoweb.com.br-error.log
	CustomLog ${APACHE_LOG_DIR}/lojainfoweb.com.br-access.log combined

</VirtualHost>
