<Virtualhost *:80>

	ServerName lojainfowebifrn.backend.biz
	ServerAdmin joaopedroaraujodemedeiros@gmail.com
	documentRoot /var/www/html/lojainfowebifrn.com/site-backend/

	ErrorLog ${APACHE_LOG_DIR}/lojainfowebifrn.com/site-backend/error.log
	CustomLog ${APACHE_LOG_DIR}/lojainfowebifrn.com/site-backend/access.log combined

	<Directory /var/www/html/lojainfowebifrn.com/site-backend>
		AuthType Basic
		AuthName "Painel LojaInfoWeb"
		AuthUserFile /etc/apache2/.htpasswd
		Require valid-user
	</Directory>

</VirtualHost>
