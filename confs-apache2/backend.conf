<VirtualHost *:80>
    ServerName lojainfoweb.backend.biz
    DocumentRoot /var/www/lojainfoweb.backend.biz

    <Directory /var/www/lojainfoweb.backend.biz>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/lojainfoweb.backend.biz-error.log
    CustomLog ${APACHE_LOG_DIR}/lojainfoweb.backend.biz-access.log combined
</VirtualHost>
